; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; 目标芯片：ESP32-S3-N16R8（ESP32-S3 内核，16MB Flash + 8MB Octal PSRAM）
; 本工程已裁剪为“仅 WiFi 连接”功能，删除了 MQTT / OLED / TFT 图传等其它功能。

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; ---- 匹配 ESP32-S3-N16R8 的真实硬件资源 ----
; 默认 board 定义是 “N8（8MB Flash，无 PSRAM）”，与 N16R8 不符，需覆盖：
board_build.flash_size = 16MB              ; N16R8 = 16MB Flash
board_upload.flash_size = 16MB             ; 让 elf2image 也按 16MB 打包
board_build.partitions = default_16MB.csv  ; 与 16MB Flash 对应的分区表

; ---- PSRAM 必须关掉（重要）----
; 本工程完全不用 PSRAM（没有 ps_malloc / 大 buffer 都在 .data）。
; N16R8 是 Octal PSRAM，而 esp32-s3-devkitc-1 默认按 QSPI PSRAM 初始化；
; 两者不匹配时 psramInit() 失败会直接 abort -> 串口刷 74880 波特率乱码 + 无限重启，
; 表现就是「串口飚得很快、全乱码、WiFi 永远连不上」。
; 如果你的板子不是 N16R8（比如 N8R2），这里同样是 disable，最安全。
board_build.psram = disable

; ---- 烧录参数（连不上时看这里）----
; ESP32-S3-DevKitC-1 有两个 USB 口，会在电脑上枚举成两个 COM：
;   COMxx  CH343/CP2102  UART 口（板子上标 "COM"/"UART"）  VID 1A86 / 10C4
;   COMxx  303A:1001     原生 USB 口（标 "USB"），跑起来才有   VID 303A
; 两个都能烧。UART 口靠 DTR/RTS 自动复位进下载模式，板子省了这两根线
; 或 CH343 驱动不配合时就会 "No serial data received"；此时改用原生 USB
; 口，或者按住 BOOT 再点 RST 手动进下载模式。
; 921600 在部分 CH343 板子上握手不稳，降到 115200 最保险（只影响烧录耗时）。
upload_speed = 115200

monitor_speed = 115200
